[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "BLE",
    "DTZ",
]

ignore = [
    "B008",
]

[tool.ruff.lint.isort]
# The local "alembic/" migrations folder would otherwise make ruff treat
# the alembic package as first-party code.
known-third-party = ["alembic"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
