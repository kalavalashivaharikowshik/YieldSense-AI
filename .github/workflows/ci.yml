name: CI

# Runs on every pull request and every push, so problems are caught
# before (and independently of) the deploy workflows.
on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: Backend lint, migrations and tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: yieldsense
          POSTGRES_PASSWORD: yieldsense
          POSTGRES_DB: yieldsense_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U yieldsense"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: postgresql://yieldsense:yieldsense@localhost:5432/yieldsense_test
      TEST_DATABASE_URL: postgresql://yieldsense:yieldsense@localhost:5432/yieldsense_test
      SECRET_KEY: ci-secret-key-not-used-in-production
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "60"
      LOG_FILE: /tmp/yieldsense-ci.log

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Apply migrations and check they match the models
        run: |
          alembic upgrade head
          alembic check

      - name: Run tests
        run: pytest

  web:
    name: Web lint and build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          VITE_API_BASE_URL: https://example.invalid/api

  mobile:
    name: Mobile lint
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - run: npm ci
      - run: npx eslint .
